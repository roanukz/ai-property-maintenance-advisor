# Tracked mutations (PLAN section 5). agent/tests/mutate.py applies each one in
# a temporary copy of the repo and runs the listed node IDs, which must go red.
# `search` must occur exactly once in `file`; omit it to create `file` instead.
# Literal strings ('...' and '''...''') are used so nothing is unescaped by TOML.

# ---------------------------------------------------------------------------
# Canaries: prove the copy's own agent package is imported, in pytest and in
# child processes. Each must be KILLED.
# ---------------------------------------------------------------------------

[[mutation]]
id = "canary_in_process"
file = "agent/ledger.py"
search = '''    def run_credits(self, run_id: str) -> int:
        with self._connect() as conn:
            return self._run_sums(conn, run_id)[2]'''
replace = '''    def run_credits(self, run_id: str) -> int:
        return -1'''
tests = ["agent/tests/test_ledger.py::test_credit_caps"]
why = "changes only the copy's config; KILLED proves pytest imports the copy, not the editable install"

[[mutation]]
id = "canary_child_process"
file = "agent/cli.py"
search = '''    if environ.get(config.ENV_TRACING) == "1":
        return True
    for name in config.TRACING_ENV_VARS:'''
replace = '''    if environ.get(config.ENV_TRACING) == "1":
        return True
    for name in ():'''
tests = ["agent/tests/test_cli_tracing.py::test_cli_scrubs_tracing_unless_opted_in"]
why = "only the child process imports cli.main here; KILLED proves the child imports the copy"

